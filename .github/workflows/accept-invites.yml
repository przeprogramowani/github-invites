name: Accept repository invites

on:
  schedule:
    - cron: "0 6 */2 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List invites without accepting"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: accept-invites
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the workflow code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Accept pending invites
        run: npm run invites:accept -- ${{ inputs.dry_run == true && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_INVITES_TOKEN }}
